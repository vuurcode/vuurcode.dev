<script>
  if (location.hostname.indexOf('www.') === 0) {
    location.replace(location.protocol + '//' + location.hostname.slice(4) + (location.port ? ':' + location.port : '') + location.pathname + location.search + location.hash);
  }
</script>
<script>
  // The site is not a PWA. Remove a service worker that an earlier visit registered, so it cannot serve stale pages.
  if (navigator.serviceWorker) {
    navigator.serviceWorker.getRegistrations().then(function (registrations) {
      registrations.forEach(function (registration) { registration.unregister(); });
    });
  }
</script>
