services:
  jekyll:
    build:
        context: .
        dockerfile: Containerfile
    command: bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling --config _config.yml,_config.dev.yml
    ports:
      - "4000:4000"  # http://localhost:4000
      - "35729:35729"  # Live reload port
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
    networks:
      - dashboard-net

networks:
  dashboard-net:
    driver: bridge
